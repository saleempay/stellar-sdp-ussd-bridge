# Offline checks only: install, typecheck, unit tests and the secret scan.
# Nothing here touches the network, testnet, Docker or the SDP, and nothing
# here needs a secret. Live runs are recorded in EVIDENCE.md instead.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: install, typecheck, offline tests, secret scan
    runs-on: ubuntu-latest
    steps:
      # actions pinned to a commit SHA, the same standard as the compose
      # file's image digests; the comment names the tag the SHA was read from
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the adapter is consumed as a git submodule at a pinned commit
          submodules: true
          # full history so the secret scan can read the lines each commit
          # of the pull request adds, not only the final tree
          fetch-depth: 0

      # 22 is the minimum this package declares in engines. Testing the
      # floor rather than the newest release is deliberate.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # build the vendored adapter so its dist/ exists for the typecheck
      - run: npm run adapter:build

      - run: npm run typecheck

      # the scripts under scripts/ import dist/, and several tests spawn them;
      # the test run itself also rebuilds dist/ (vitest globalSetup), so no
      # test depends on another file having built it
      - run: npm run build

      - run: npm test

      - name: secret scan
        # GITHUB_BASE_REF names the pull request base; the script scans the
        # lines added by origin/<base>..HEAD as well as the tree
        run: sh scripts/secret-scan.sh
